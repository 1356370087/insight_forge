services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      RUNS_DIR: /data/runs
      FRONTEND_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - research-runs:/data/runs

  frontend:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_RESEARCH_API_BASE: /api/research
        NEXT_PUBLIC_LOCAL_DEV_AUTH_BYPASS: ${LOCAL_DEV_AUTH_BYPASS:-false}
    depends_on: [api]

  proxy:
    image: nginx:1.29-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/research-console.nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, api]

volumes:
  research-runs:
