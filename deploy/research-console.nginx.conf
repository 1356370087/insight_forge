events {}

http {
  upstream research_frontend { server frontend:3000; }
  upstream research_api { server api:2024; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /api/research/internal/sandbox {
      return 404;
    }

    location ^~ /api/research/internal/sandbox/ {
      return 404;
    }

    location /api/research/ {
      proxy_pass http://research_api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location / {
      proxy_pass http://research_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
